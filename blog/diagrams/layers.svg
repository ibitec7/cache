<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822.709 92.9" width="822.709" height="92.9" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #0d1117 !important;
      --fg: #e6edf3 !important;
      --line: #3d444d !important;
      --accent: #4493f8 !important;
      --muted: #9198a1 !important;
    }
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="d" data-to="h" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="208.14999999999998,44.900000000000006 254.14999999999998,44.900000000000006" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="h" data-to="s" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="403.54499999999996,44.900000000000006 449.54499999999996,44.900000000000006" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="s" data-to="m" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="593.012,44.900000000000006 639.012,44.900000000000006" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="d" data-label="lifetime d
reuse distance, bucketed" data-shape="rectangle">
  <rect x="18" y="18" width="190.14999999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="113.07499999999999" y="44.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="113.07499999999999" dy="-3.9000000000000012">lifetime d</tspan><tspan x="113.07499999999999" dy="16.900000000000002">reuse distance, bucketed</tspan></text>
</g>
<g class="node" data-id="h" data-label="hazard h(b)
the only fitted layer" data-shape="rectangle">
  <rect x="254.14999999999998" y="18" width="149.395" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="328.84749999999997" y="44.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="328.84749999999997" dy="-3.9000000000000012">hazard h(b)</tspan><tspan x="328.84749999999997" dy="16.900000000000002">the only fitted layer</tspan></text>
</g>
<g class="node" data-id="s" data-label="survival S(t)
products of 1 - h(b)" data-shape="rectangle">
  <rect x="449.54499999999996" y="18" width="143.467" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="521.2785" y="44.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="521.2785" dy="-3.9000000000000012">survival S(t)</tspan><tspan x="521.2785" dy="16.900000000000002">products of 1 - h(b)</tspan></text>
</g>
<g class="node" data-id="m" data-label="curve m(C)
one sum per capacity" data-shape="rectangle">
  <rect x="639.012" y="18" width="165.697" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="721.8605" y="44.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="721.8605" dy="-3.9000000000000012">curve m(C)</tspan><tspan x="721.8605" dy="16.900000000000002">one sum per capacity</tspan></text>
</g>
</svg>