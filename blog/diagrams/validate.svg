<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 427.381 309.6" width="427.381" height="309.6" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #0d1117 !important;
      --fg: #e6edf3 !important;
      --line: #3d444d !important;
      --accent: #4493f8 !important;
      --muted: #9198a1 !important;
    }
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="oot" data-label="out of time">
  <rect x="18" y="18" width="391.381" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="18" y="18" width="391.381" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="30" y="32" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">out of time</text>
</g>
<g class="subgraph" data-id="loco" data-label="leave one cluster out">
  <rect x="18" y="177.8" width="324.92" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="18" y="177.8" width="324.92" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="30" y="191.8" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">leave one cluster out</text>
</g>
<polyline class="edge" data-from="o1" data-to="o2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="124.11500000000001,88.9 181.971,88.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="o2" data-to="o3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="270.604,88.9 304.748,88.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="l1" data-to="l2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="147.827,248.70000000000002 181.971,248.70000000000002" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="o1" data-label="train
first 60%" data-shape="rectangle">
  <rect x="34" y="62" width="90.11500000000001" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="79.0575" y="88.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="79.0575" dy="-3.9000000000000012">train</tspan><tspan x="79.0575" dy="16.900000000000002">first 60%</tspan></text>
</g>
<g class="node" data-id="o2" data-label="validate
next 15%" data-shape="rectangle">
  <rect x="181.971" y="62" width="88.633" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="226.2875" y="88.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="226.2875" dy="-3.9000000000000012">validate</tspan><tspan x="226.2875" dy="16.900000000000002">next 15%</tspan></text>
</g>
<g class="node" data-id="o3" data-label="test
last 25%" data-shape="rectangle">
  <rect x="304.748" y="62" width="88.633" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="349.0645" y="88.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="349.0645" dy="-3.9000000000000012">test</tspan><tspan x="349.0645" dy="16.900000000000002">last 25%</tspan></text>
</g>
<g class="node" data-id="l1" data-label="train
three traces" data-shape="rectangle">
  <rect x="34" y="221.8" width="113.827" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="90.9135" y="248.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="90.9135" dy="-3.9000000000000012">train</tspan><tspan x="90.9135" dy="16.900000000000002">three traces</tspan></text>
</g>
<g class="node" data-id="l2" data-label="test
the held-out one" data-shape="rectangle">
  <rect x="181.971" y="221.8" width="133.09300000000002" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="248.5175" y="248.70000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="248.5175" dy="-3.9000000000000012">test</tspan><tspan x="248.5175" dy="16.900000000000002">the held-out one</tspan></text>
</g>
</svg>