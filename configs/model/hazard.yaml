# Discrete hazard model. Variant A: one row per request, step index as a feature.
objective: binary
metric: binary_logloss
num_leaves: 63
learning_rate: 0.05
min_data_in_leaf: 50
feature_fraction: 0.9
bagging_fraction: 0.8
bagging_freq: 1
lambda_l2: 1.0
num_threads: 0
seed: 7
num_boost_round: 400
early_stopping_rounds: 50
